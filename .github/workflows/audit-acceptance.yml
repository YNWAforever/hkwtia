name: Audit acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS URL of the isolated Preview deployment
        required: true
        type: string
      run_authenticated:
        description: Run isolated authenticated journeys (requires audit-isolated secrets)
        required: false
        default: false
        type: boolean

      batch_worker_paused:
        description: Attest the isolated Preview batch worker is paused for controlled browser faults
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify disposable PostgreSQL transactions and concurrency
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: >-
          npx vitest run
          tests/integration/admin-batch-snapshot.test.ts
          tests/integration/admin-batch-concurrency.test.ts
          tests/integration/admin-batch-browser-fixture.test.ts
          tests/integration/member-import-commit.test.ts
          tests/integration/membership-grant-batch.test.ts
          tests/integration/admin-batch-ticket-resend.test.ts
          tests/integration/admin-batch-export.test.ts
          tests/integration/event-attendee-batch-export.test.ts
          tests/integration/shared-rate-limit.test.ts
          tests/integration/ticket-email-capacity.test.ts
          tests/integration/bulk-communication-eligibility.test.ts
          tests/integration/member-import-retention.test.ts
          tests/integration/audit-migration-upgrade.test.ts
          tests/integration/ticket-eligibility-postgres.test.ts
          --maxWorkers=1
      - name: Save isolated test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-postgres-failure
          path: test-results/
          if-no-files-found: ignore

  preview-public:
    environment: audit-isolated
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
      PLAYWRIGHT_PUBLIC_AUTH: "true"
      VERCEL_SHARE_URL: ${{ secrets.AUDIT_VERCEL_SHARE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject production alias and non-HTTPS targets
        run: |
          node --input-type=module -e 'const u = new URL(process.env.PLAYWRIGHT_BASE_URL); if (u.protocol !== "https:" || u.hostname === "hkwtia.vercel.app") { throw new Error("ISOLATED_HTTPS_PREVIEW_REQUIRED"); }'
      - run: npx playwright install --with-deps chromium
      - name: Enter authorized protected Preview when configured
        if: env.VERCEL_SHARE_URL != ''
        run: |
          node --input-type=module -e 'if (new URL(process.env.VERCEL_SHARE_URL).origin !== new URL(process.env.PLAYWRIGHT_BASE_URL).origin) throw new Error("PREVIEW_SHARE_ORIGIN_MISMATCH")'
          node scripts/vercel-preview-session.mjs
          echo "PLAYWRIGHT_STORAGE_STATE=.playwright/preview-state.json" >> "$GITHUB_ENV"
      - name: Verify bilingual public routes on the supplied Preview
        run: npx playwright test tests/e2e/core-pages.spec.ts tests/e2e/public-navigation.spec.ts tests/e2e/public-rendering.spec.ts --reporter=line
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-preview-public-failure
          path: test-results/
          if-no-files-found: ignore

  isolated-authenticated:
    if: inputs.run_authenticated
    runs-on: ubuntu-latest
    environment: audit-isolated
    timeout-minutes: 45
    env:
      AUDIT_ISOLATED_ACCEPTANCE: "true"
      MEMBER_IMPORT_ENABLED: "true"
      MEMBERSHIP_GRANTS_ENABLED: "true"
      VERCEL_SHARE_URL: ${{ secrets.AUDIT_VERCEL_SHARE_URL }}
      AUDIT_BATCH_WORKER_PAUSED: ${{ inputs.batch_worker_paused }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
      APP_URL: ${{ inputs.preview_url }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/audit-authenticated.json
      DATABASE_URL_TEST: ${{ secrets.AUDIT_DATABASE_URL_TEST }}
      M2_TEST_NEON_PROJECT_ID: ${{ secrets.AUDIT_M2_TEST_NEON_PROJECT_ID }}
      M2_TEST_NEON_HOST: ${{ secrets.AUDIT_M2_TEST_NEON_HOST }}
      NEON_AUTH_BASE_URL: ${{ secrets.AUDIT_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.AUDIT_NEON_AUTH_COOKIE_SECRET }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.AUDIT_STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.AUDIT_STRIPE_TEST_WEBHOOK_SECRET }}
      STRIPE_TEST_STARTUP_PRICE_ID: ${{ secrets.AUDIT_STRIPE_TEST_STARTUP_PRICE_ID }}
      STRIPE_TEST_CORPORATE_PRICE_ID: ${{ secrets.AUDIT_STRIPE_TEST_CORPORATE_PRICE_ID }}
      M2_TEST_STAFF_EMAIL: ${{ secrets.AUDIT_M2_TEST_STAFF_EMAIL }}
      M2_TEST_STAFF_PASSWORD: ${{ secrets.AUDIT_M2_TEST_STAFF_PASSWORD }}
      M2_TEST_MEMBER_EMAIL: ${{ secrets.AUDIT_M2_TEST_MEMBER_EMAIL }}
      M2_TEST_MEMBER_PASSWORD: ${{ secrets.AUDIT_M2_TEST_MEMBER_PASSWORD }}
      M2_TEST_COMPANY_ADMIN_EMAIL: ${{ secrets.AUDIT_M2_TEST_COMPANY_ADMIN_EMAIL }}
      M2_TEST_COMPANY_ADMIN_PASSWORD: ${{ secrets.AUDIT_M2_TEST_COMPANY_ADMIN_PASSWORD }}
      M2_TEST_EXCO_EMAIL: ${{ secrets.AUDIT_M2_TEST_EXCO_EMAIL }}
      M2_TEST_EXCO_PASSWORD: ${{ secrets.AUDIT_M2_TEST_EXCO_PASSWORD }}
      M2_TEST_SUPERADMIN_EMAIL: ${{ secrets.AUDIT_M2_TEST_SUPERADMIN_EMAIL }}
      M2_TEST_SUPERADMIN_PASSWORD: ${{ secrets.AUDIT_M2_TEST_SUPERADMIN_PASSWORD }}
      HKWTIA_TEST_PENDING_MEMBERSHIP_ID: ${{ secrets.AUDIT_HKWTIA_TEST_PENDING_MEMBERSHIP_ID }}
      HKWTIA_TEST_GUEST_CHECKIN_EVENT_ID: ${{ secrets.AUDIT_HKWTIA_TEST_GUEST_CHECKIN_EVENT_ID }}
      HKWTIA_TEST_GUEST_CHECKIN_EMAIL: ${{ secrets.AUDIT_HKWTIA_TEST_GUEST_CHECKIN_EMAIL }}
      HKWTIA_TEST_GUEST_CHECKIN_EMAIL_ZH: ${{ secrets.AUDIT_HKWTIA_TEST_GUEST_CHECKIN_EMAIL_ZH }}
      HKWTIA_TEST_GUEST_RSVP_SLUG: ${{ secrets.AUDIT_HKWTIA_TEST_GUEST_RSVP_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail closed on missing isolated database, identities or test-mode configuration
        run: npx tsx scripts/audit-acceptance-preflight.ts
      - run: npx playwright install --with-deps chromium
      - name: Enter authorized protected Preview when configured
        if: env.VERCEL_SHARE_URL != ''
        run: |
          node --input-type=module -e 'if (new URL(process.env.VERCEL_SHARE_URL).origin !== new URL(process.env.PLAYWRIGHT_BASE_URL).origin) throw new Error("PREVIEW_SHARE_ORIGIN_MISMATCH")'
          node scripts/vercel-preview-session.mjs
          echo "PLAYWRIGHT_STORAGE_STATE=.playwright/preview-state.json" >> "$GITHUB_ENV"
      - name: Run existing authenticated journey suites
        run: >-
          npx playwright test
          tests/e2e/m2-admin-crm.spec.ts
          tests/e2e/admin-members.spec.ts
          tests/e2e/admin-batches.spec.ts
          tests/e2e/admin-imports.spec.ts
          tests/e2e/admin-grants.spec.ts
          tests/e2e/join-resume.spec.ts
          tests/e2e/membership-checkout.spec.ts
          tests/e2e/admin-event-authoring.spec.ts
          tests/e2e/guest-rsvp-recovery.spec.ts
          tests/e2e/ticket-checkout-recovery.spec.ts
          tests/e2e/event-check-in.spec.ts
          tests/e2e/public-cache-isolation.spec.ts
          --reporter=line,json
      - name: Reject skipped or unexecuted acceptance
        run: npx tsx scripts/audit-assert-browser-report.ts test-results/audit-authenticated.json
      - name: Save isolated acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-authenticated-evidence
          path: test-results/audit-authenticated.json
          if-no-files-found: ignore
