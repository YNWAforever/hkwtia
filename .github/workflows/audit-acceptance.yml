name: Audit acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS URL of the isolated Preview deployment (public browser checks only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify disposable PostgreSQL transactions and concurrency
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: >-
          npx vitest run
          tests/integration/admin-batch-snapshot.test.ts
          tests/integration/admin-batch-concurrency.test.ts
          tests/integration/member-import-commit.test.ts
          tests/integration/membership-grant-batch.test.ts
          tests/integration/admin-batch-ticket-resend.test.ts
          tests/integration/admin-batch-export.test.ts
          tests/integration/shared-rate-limit.test.ts
          tests/integration/ticket-email-capacity.test.ts
      - name: Save isolated test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-postgres-failure
          path: test-results/
          if-no-files-found: ignore

  preview-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject production alias and non-HTTPS targets
        run: |
          node --input-type=module -e 'const u = new URL(process.env.PLAYWRIGHT_BASE_URL); if (u.protocol !== "https:" || u.hostname === "hkwtia.vercel.app") { throw new Error("ISOLATED_HTTPS_PREVIEW_REQUIRED"); }'
      - run: npx playwright install --with-deps chromium
      - name: Verify bilingual public routes on the supplied Preview
        run: npx playwright test tests/e2e/core-pages.spec.ts tests/e2e/public-navigation.spec.ts --reporter=line
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-preview-public-failure
          path: test-results/
          if-no-files-found: ignore
